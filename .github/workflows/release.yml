name: Release modpack

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Package and validate modpack
        run: python3 scripts/package_modpack.py "$RELEASE_TAG" "$RUNNER_TEMP/modpack-release"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/modpack-release/Malevolent-Colonies-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$archive" \
              --title "Malevolent Colonies ${RELEASE_TAG#v}" \
              "${flags[@]}"
          fi
